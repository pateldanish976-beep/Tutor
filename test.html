<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EasyGrade — Test Portal</title>
    <meta name="description" content="EasyGrade Test Portal — timed tests, instant scoring, and progress tracking.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">EasyGrade</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="/test.html">Test Portal</a></li>
            <li class="nav-item"><a class="nav-link" href="/careers.html">Careers (Tutors)</a></li>
            <li class="nav-item"><a class="btn btn-primary ms-2" href="/">Back to Home</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row">
        <div class="col-lg-8 mx-auto">
          <div class="card shadow-sm">
            <div class="card-body">
              <h3 class="card-title">Test Portal</h3>
              <p class="text-muted">Try a timed sample test. You can retake tests and view past results stored locally.</p>

              <div id="test-setup" class="mb-4">
                <div class="mb-3">
                  <label for="subjectSelect" class="form-label">Subject</label>
                  <select id="subjectSelect" class="form-select">
                    <option value="math">Math</option>
                    <option value="english">English</option>
                    <option value="science">Science</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="timeLimit" class="form-label">Time limit (minutes)</label>
                  <input id="timeLimit" type="number" class="form-control" value="10" min="1">
                </div>
                <button id="startTest" class="btn btn-primary">Start Test</button>
                <button id="viewResults" class="btn btn-outline-secondary ms-2">View Past Results</button>
              </div>

              <div id="test-area" class="d-none">
                <div class="d-flex justify-content-between mb-2">
                  <div>Question <span id="currentIndex">1</span>/<span id="totalQuestions">1</span></div>
                  <div>Time left: <strong id="timer">00:00</strong></div>
                </div>
                <div id="questionCard" class="border rounded p-3 mb-3"></div>
                <div class="d-flex justify-content-between">
                  <button id="prevBtn" class="btn btn-outline-secondary">Previous</button>
                  <div>
                    <button id="nextBtn" class="btn btn-outline-secondary me-2">Next</button>
                    <button id="submitBtn" class="btn btn-success">Submit Test</button>
                  </div>
                </div>
              </div>

              <div id="results-area" class="d-none">
                <h5>Results</h5>
                <p id="scoreText" class="lead"></p>
                <div id="feedback" class="mb-3"></div>
                <button id="retakeBtn" class="btn btn-primary">Retake</button>
                <button id="backSetup" class="btn btn-outline-secondary ms-2">Back</button>
              </div>

              <div id="historyArea" class="d-none">
                <h5>Past Results (local)</h5>
                <ul id="historyList" class="list-group"></ul>
                <button id="closeHistory" class="btn btn-outline-secondary mt-3">Close</button>
              </div>

            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
      // Sample questions for the demo. In a full implementation these would come from a backend.
      const sampleQuestions = {
        math: [
          { id: 1, type: 'mcq', text: 'What is 8 × 7?', options: ['54', '56', '58', '64'], answer: 1 },
          { id: 2, type: 'mcq', text: 'Solve: 12 ÷ 3 + 4', options: ['8', '6', '7', '4'], answer: 0 },
          { id: 3, type: 'mcq', text: 'What is the square root of 81?', options: ['7', '8', '9', '10'], answer: 2 }
        ],
        english: [
          { id: 1, type: 'mcq', text: 'Choose the correct form: "She ___ to the store yesterday."', options: ['go', 'goes', 'went', 'gone'], answer: 2 },
          { id: 2, type: 'mcq', text: 'Select the synonym of "happy".', options: ['sad', 'elated', 'angry', 'tired'], answer: 1 }
        ],
        science: [
          { id: 1, type: 'mcq', text: 'Water boils at what temperature at sea level?', options: ['90°C', '100°C', '110°C', '120°C'], answer: 1 }
        ]
      };

      document.addEventListener('DOMContentLoaded', () => {
        TestPortal.bindUI();
        document.getElementById('startTest').addEventListener('click', () => {
          const sub = document.getElementById('subjectSelect').value;
          const time = parseInt(document.getElementById('timeLimit').value, 10) || 10;
          TestPortal.start(sampleQuestions[sub], time);
        });
        document.getElementById('viewResults').addEventListener('click', () => TestPortal.showHistory());
      });
    </script>
  </body>
</html>
