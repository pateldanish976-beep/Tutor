<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EasyGrade — Test Portal</title>
    <meta name="description" content="EasyGrade Test Portal — timed tests, instant scoring, and progress tracking.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">EasyGrade</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="/test.html">Test Portal</a></li>
            <li class="nav-item"><a class="nav-link" href="/careers.html">Careers (Tutors)</a></li>
            <li class="nav-item"><a class="btn btn-primary ms-2" href="/">Back to Home</a></li>
            <li class="nav-item ms-2"><a id="signInBtn" class="nav-link" href="#">Sign In</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row">
        <div class="col-lg-8 mx-auto">
          <div class="card shadow-sm">
            <div class="card-body">
              <h3 class="card-title">Test Portal</h3>
              <p class="text-muted">Try a timed sample test. You can retake tests and view past results stored locally (or in your account if signed in).</p>

              <div id="test-setup" class="mb-4">
                <div class="mb-3">
                  <label for="subjectSelect" class="form-label">Subject</label>
                  <select id="subjectSelect" class="form-select">
                    <option value="math">Math</option>
                    <option value="english">English</option>
                    <option value="science">Science</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="timeLimit" class="form-label">Time limit (minutes)</label>
                  <input id="timeLimit" type="number" class="form-control" value="10" min="1">
                </div>
                <button id="startTest" class="btn btn-primary">Start Test</button>
                <button id="viewResults" class="btn btn-outline-secondary ms-2">View Past Results</button>
              </div>

              <div id="test-area" class="d-none">
                <div class="d-flex justify-content-between mb-2">
                  <div>Question <span id="currentIndex">1</span>/<span id="totalQuestions">1</span></div>
                  <div>Time left: <strong id="timer">00:00</strong></div>
                </div>
                <div id="questionCard" class="border rounded p-3 mb-3"></div>
                <div class="d-flex justify-content-between">
                  <button id="prevBtn" class="btn btn-outline-secondary">Previous</button>
                  <div>
                    <button id="nextBtn" class="btn btn-outline-secondary me-2">Next</button>
                    <button id="submitBtn" class="btn btn-success">Submit Test</button>
                  </div>
                </div>
              </div>

              <div id="results-area" class="d-none">
                <h5>Results</h5>
                <p id="scoreText" class="lead"></p>
                <div id="feedback" class="mb-3"></div>
                <button id="retakeBtn" class="btn btn-primary">Retake</button>
                <button id="backSetup" class="btn btn-outline-secondary ms-2">Back</button>
              </div>

              <div id="historyArea" class="d-none">
                <h5>Past Results (local)</h5>
                <ul id="historyList" class="list-group"></ul>
                <button id="closeHistory" class="btn btn-outline-secondary mt-3">Close</button>
              </div>

            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Auth modal (shared) -->
    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Sign In / Sign Up</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="authForm">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="authEmail" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="authPassword" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Role</label>
                <select id="authRole" class="form-select"><option value="student">Student</option><option value="tutor">Tutor</option></select>
              </div>
              <div class="d-flex justify-content-between">
                <button id="signInAction" type="button" class="btn btn-primary">Sign In</button>
                <button id="signUpAction" type="button" class="btn btn-outline-secondary">Sign Up</button>
              </div>
            </form>
            <div id="authMessage" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="/assets/js/firebase-config.example.js"></script>
    <script src="/assets/js/firebase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/main.js"></script>
    <script>
      // Hook sign in button
      document.getElementById('signInBtn').addEventListener('click', ()=>{
        const modal = new bootstrap.Modal(document.getElementById('authModal'));
        modal.show();
      });

      // auth modal actions
      document.getElementById('signInAction').addEventListener('click', async ()=>{
        const email = document.getElementById('authEmail').value;
        const pass = document.getElementById('authPassword').value;
        const msg = document.getElementById('authMessage');
        msg.textContent = '';
        if(window.FirebaseHelpers && FirebaseHelpers.isEnabled()){
          try{ await FirebaseHelpers.signIn(email,pass); msg.innerHTML = '<div class="alert alert-success">Signed in</div>'; const modal = bootstrap.Modal.getInstance(document.getElementById('authModal')); modal.hide(); }
          catch(e){ msg.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
        } else { msg.innerHTML = '<div class="alert alert-warning">Firebase not configured. Running in demo mode.</div>'; }
      });

      document.getElementById('signUpAction').addEventListener('click', async ()=>{
        const email = document.getElementById('authEmail').value;
        const pass = document.getElementById('authPassword').value;
        const role = document.getElementById('authRole').value;
        const msg = document.getElementById('authMessage');
        msg.textContent = '';
        if(window.FirebaseHelpers && FirebaseHelpers.isEnabled()){
          try{ await FirebaseHelpers.signUp(email,pass,'',role); msg.innerHTML = '<div class="alert alert-success">Account created. Signed in.</div>'; const modal = bootstrap.Modal.getInstance(document.getElementById('authModal')); modal.hide(); }
          catch(e){ msg.innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
        } else { msg.innerHTML = '<div class="alert alert-warning">Firebase not configured. Running in demo mode.</div>'; }
      });

    </script>
  </body>
</html>
