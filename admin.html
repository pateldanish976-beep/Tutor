<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EasyGrade — Admin Dashboard</title>
    <meta name="description" content="Admin dashboard to review applications and results.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">EasyGrade</a>
        <div class="ms-auto">
          <button id="signOutBtn" class="btn btn-outline-secondary">Sign Out</button>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <h3>Admin Dashboard</h3>
      <p class="text-muted">Requires Firebase admin setup (see README). If Firebase not configured, this page will show instructions.</p>

      <div id="adminContent" class="d-none">
        <section class="mb-5">
          <h5>Recent Test Results</h5>
          <div id="resultsList"></div>
        </section>
        <section>
          <h5>Recent Tutor Applications</h5>
          <div id="appsList"></div>
        </section>
      </div>

      <div id="adminPlaceholder">
        <div class="alert alert-info">Firebase not configured or you are not an admin. See README for setup instructions.</div>
      </div>

    </main>

    <script src="/assets/js/firebase-config.example.js"></script>
    <script src="/assets/js/firebase.js"></script>
    <script>
      async function setupAdmin(){
        if(!(window.FirebaseHelpers && FirebaseHelpers.isEnabled())){
          document.getElementById('adminPlaceholder').style.display = 'block';
          return;
        }
        // wait for auth state
        FirebaseHelpers.onAuth(async (user)=>{
          if(!user){ document.getElementById('adminPlaceholder').style.display = 'block'; return; }
          const uid = user.uid;
          if(!FirebaseHelpers.isAdminUid(uid)){ document.getElementById('adminPlaceholder').innerHTML = '<div class="alert alert-danger">You are signed in but not an admin (see README to set admins).</div>'; return; }
          // fetch data
          const results = await FirebaseHelpers.listRecentResults(50);
          const apps = await FirebaseHelpers.listApplications(50);
          const resultsList = document.getElementById('resultsList');
          resultsList.innerHTML = '';
          results.forEach(r=>{
            const el = document.createElement('div'); el.className='card mb-2 p-2'; el.innerHTML = `<div><strong>${r.score}/${r.total} (${r.percent}%)</strong> — ${new Date(r.date).toLocaleString()}</div><div class="text-muted">uid: ${r.uid}</div>`; resultsList.appendChild(el);
          });
          const appsList = document.getElementById('appsList');
          appsList.innerHTML = '';
          apps.forEach(a=>{
            const el = document.createElement('div'); el.className='card mb-2 p-2'; el.innerHTML = `<div><strong>${a.name}</strong> — ${a.subject} — <a href="${a.resumeUrl}" target="_blank">Resume</a></div><div class="text-muted">${new Date(a.date).toLocaleString()}</div>`; appsList.appendChild(el);
          });
          document.getElementById('adminPlaceholder').style.display='none';
          document.getElementById('adminContent').classList.remove('d-none');
        });
      }
      document.addEventListener('DOMContentLoaded', setupAdmin);
      document.getElementById('signOutBtn').addEventListener('click', async ()=>{ if(window.FirebaseHelpers && FirebaseHelpers.isEnabled()){ await FirebaseHelpers.signOutUser(); location.href='/'; } else location.href='/'; });
    </script>
  </body>
</html>
